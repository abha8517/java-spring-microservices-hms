version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"  # Jaeger Thrift Compact Protocol
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - hms_network

  analytics-service:
    build: ./analytics-service
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
      # Add other environment variables if needed, e.g., Kafka brokers
      # KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - jaeger
    networks:
      - hms_network

  api-gateway:
    build: ./api-gateway
    ports:
      - "4004:4004"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
      # Ensure service discovery uses Docker DNS (e.g., http://auth-service:4005)
    depends_on:
      - jaeger
      - auth-service
      - patient-service
    networks:
      - hms_network

  auth-service:
    build: ./auth-service
    ports:
      - "4005:4005"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

  billing-service:
    build: ./billing-service
    ports:
      - "4001:4001" # HTTP port
      - "9001:9001" # gRPC port
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

  patient-service:
    build: ./patient-service
    ports:
      - "4000:4000"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

  appointment-scheduling-service:
    build: ./appointment-scheduling-service
    ports:
      - "8081:8081"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

  doctor-management-service:
    build: ./doctor-management-service
    ports:
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

  medical-records-service:
    build: ./medical-records-service
    ports:
      - "8083:8083"
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - hms_network

networks:
  hms_network: # Explicitly define the network
    driver: bridge
    name: hms_network # Optional: define a custom name for the network
