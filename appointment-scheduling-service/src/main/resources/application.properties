spring.application.name=appointment-scheduling-service
server.port=8081

# OpenTelemetry Configuration
otel.sdk.disabled=false
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.traces.endpoint=http://localhost:4318/v1/traces # This will be overridden by Docker Compose env var
otel.metrics.exporter=none
otel.service.name=${spring.application.name}

# gRPC server port (if different from Spring Boot's server.port and not managed by starter default)
# The lognet starter usually runs gRPC on a separate port, default 6565 or configured.
# For simplicity, if your gRPC services are exposed via Spring MVC controllers or if the starter handles it,
# you might not need a separate grpc.server.port here unless explicitly managing it.
# Let's assume for now the grpc-spring-boot-starter default is fine or it co-exists.
# If issues arise, we might need:
# grpc.server.port=6565
# or similar, depending on how io.github.lognet:grpc-spring-boot-starter works by default.
# The pom.xml for billing-service had grpc.server.port=9001, so this service might also need one.
# Let's add a placeholder, assuming a common pattern or future need.
grpc.server.port=9002
